<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="design.css">
    <title>Chronotype</title>
</head>

<body>

    <div class="main-container">

        <!-- LEFT SIDE -->
        <div class="left-content">

            <img src="temporarylogo.png" class="placeholderlogo">

            <h1>Heading</h1>

            <p>
                Some text. Lorem ipsum di ko kabisado ok na yan pagod na ko
                di ko mahanap sa google dawg huhuhuhu ok lorem ipsum ule
                testing ko lang tho ano ilalagay sa ilalim neto?
                If may lalagay kayo edit nalang margin sa css
            </p>

            <div class="buttons">
                <button class="savebutton">Save Data</button>
                <button class="loadbutton">Load Data (JSON)</button>
            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="right-content">

            <div class="calendar">

    <div class="calendar-header">
        <button id="prevMonth">&#10094;</button>

        <h2 id="monthYear"></h2>

        <button id="nextMonth">&#10095;</button>
    </div>

    <div class="weekdays">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
    </div>

    <div class="days" id="days"></div>

</div>

    </div>


    <script>

const monthYear = document.getElementById("monthYear");
const daysContainer = document.getElementById("days");

const prevMonth = document.getElementById("prevMonth");
const nextMonth = document.getElementById("nextMonth");

let currentDate = new Date();

function renderCalendar() {

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    const monthName = currentDate.toLocaleString("default", {
        month: "long"
    });

    monthYear.textContent = `${monthName} ${year}`;

    daysContainer.innerHTML = "";

    // Empty boxes before the first day
    for (let i = 0; i < firstDay; i++) {

        const emptyDay = document.createElement("div");

        emptyDay.classList.add("empty");

        daysContainer.appendChild(emptyDay);
    }

    // Create calendar dates
    for (let day = 1; day <= lastDate; day++) {

        const dayElement = document.createElement("div");

        dayElement.classList.add("day");

        dayElement.innerHTML = `
            <span class="date-number">${day}</span>
            <div class="task">
                <!-- Task description will appear here -->
            </div>
        `;

        // Highlight today
        const today = new Date();

        if (
            day === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear()
        ) {
            dayElement.classList.add("today");
        }

        daysContainer.appendChild(dayElement);
    }
}


// Previous month
prevMonth.addEventListener("click", function () {

    currentDate.setMonth(currentDate.getMonth() - 1);

    renderCalendar();

});


// Next month
nextMonth.addEventListener("click", function () {

    currentDate.setMonth(currentDate.getMonth() + 1);

    renderCalendar();

});


renderCalendar();

</script>

</body>
</html>
