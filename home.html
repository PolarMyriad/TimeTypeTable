<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="design.css">
    <title>JSON Saving</title>
</head>
<body>
    <h1>Load a JSON File. This site will display its structure as text.</h1>
    <h2>If there is a JSON File displayed, you may Save it.</h2>

    <p id="jsonDisplay"></p> 
   <div class="buttons"> 
    <button id="saveButton">Save</button> 
    <button id="loadButton">Load</button>

    <input
        type="file"
        id="fileInput"
        accept=".json,application/json"
        hidden
    >
</div>

    <script src="saveloadfeat.js"></script>

</body>
</html>
