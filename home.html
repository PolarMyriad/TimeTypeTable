<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="design.css">

    <title>Chronotype</title>
</head>

<body>

    <div class="main-container">

       
       

        <div class="left-content">

            <img src="temporarylogo.png" class="placeholderlogo">

            <h1>Heading</h1>

            <p>
                Some text. Lorem ipsum di ko kabisado ok na yan pagod na ko
                di ko mahanap sa google dawg huhuhuhu ok lorem ipsum ule
                testing ko lang tho ano ilalagay sa ilalim neto?
                If may lalagay kayo edit nalang margin sa css
            </p>



            <div class="buttons">

                <button
                    id="saveButton"
                    class="savebutton">
                    Save Data
                </button>


     
                <button
                    id="loadButton"
                    class="loadbutton"
                    onclick="document.getElementById('loadFunction').click();">
                    Load Data (JSON)
                </button>


                <input
                    id="loadFunction"
                    type="file"
                    accept=".json,application/json"
                    hidden
                >


     
                <input
                    id="fileInput"
                    type="file"
                    accept=".json,application/json"
                    hidden
                >

            </div>

        </div>


    

        <div class="right-content">

            <div class="calendar">


                <div class="calendar-header">

                    <button id="prevMonth">
                        &#10094;
                    </button>

                    <h2 id="monthYear"></h2>

                    <button id="nextMonth">
                        &#10095;
                    </button>

                </div>



                <div class="weekdays">

                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>

                </div>



                <div
                    class="days"
                    id="days">
                </div>


            </div>

        </div>

    </div>

    <div id="taskModal" class="task-modal">
        <div class="task-modal-content">

            <button id="closeModal" class="close-modal">
                &times;
            </button>

            <h2 id="modalDate">
                Tasks
            </h2>

            <div id="modalTaskList">
            </div>
        </div>
    </div>

    <p id="jsonDisplay" hidden></p>



<script>
    const monthYear = document.getElementById("monthYear");
    const daysContainer = document.getElementById("days");
    const prevMonth = document.getElementById("prevMonth");
    const nextMonth = document.getElementById("nextMonth");

    let currentDate = new Date();

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const firstDay =
            new Date(
                year,
                month,
                1
            ).getDay();

        const lastDate =
            new Date(
                year,
                month + 1,
                0
            ).getDate();

        const monthName =
            currentDate.toLocaleString(
                "default",
                {
                    month: "long"
                }
            );

        monthYear.textContent =
            `${monthName} ${year}`;

        daysContainer.innerHTML = "";

        for (
            let i = 0;
            i < firstDay;
            i++
        ) {
            const emptyDay =
                document.createElement("div");

            emptyDay.classList.add("empty");

            daysContainer.appendChild(
                emptyDay
            );
        }

        for (
            let day = 1;
            day <= lastDate;
            day++
        ) {
            const dayElement =
                document.createElement("div");

            dayElement.classList.add("day");

            const monthNumber =
                String(month + 1)
                    .padStart(2, "0");

            const dayNumber =
                String(day)
                    .padStart(2, "0");

            const dateString =
                `${year}-${monthNumber}-${dayNumber}`;

            const tasksForThisDay =
                plannerData.tasks.filter(
                    function (task) {

                        return task.date === dateString;

                    }
                );
            
            dayElement.addEventListener(
                "click",
                function () {
                    openTaskModal(
                        dateString,
                        tasksForThisDay
                    );
                }
            );

            dayElement.innerHTML = `
                <span class="date-number">
                    ${day}
                </span>

                <div class="tasks-container">
                </div>
            `;

            const taskContainer =
                dayElement.querySelector(
                    ".tasks-container"
                );

        const MAX_VISIBLE_TASKS = 3;

            tasksForThisDay
                .slice(0, MAX_VISIBLE_TASKS)
                .forEach(
                    function (task, index) {
                        const taskElement =
                            document.createElement("div");
                        
                        taskElement.classList.add(
                            "task"
                        );

                        taskElement.textContent =
                            `• ${task.name}`;

                        if (
                            index === MAX_VISIBLE_TASKS - 1 &&
                            tasksForThisDay.length > MAX_VISIBLE_TASKS
                        ) {
                            taskElement.textContent += "...";

                        }
                        
                        taskContainer.appendChild(
                            taskElement
                        );

                    }
                );

            const today = new Date();

            if (
                day === today.getDate() &&
                month === today.getMonth() &&
                year === today.getFullYear()
            ) {

                dayElement.classList.add(
                    "today"
                );
            }

            daysContainer.appendChild(
                dayElement
            );

        }

    }

    prevMonth.addEventListener(
        "click",
        function () {

            currentDate.setMonth(
                currentDate.getMonth() - 1
            );
            renderCalendar();
        }
    );

    nextMonth.addEventListener(
        "click",
        function () {

            currentDate.setMonth(
                currentDate.getMonth() + 1
            );
            renderCalendar();
        }
    );

    const taskModal = document.getElementById("taskModal");
    const modalDate = document.getElementById("modalDate");
    const modalTaskList = document.getElementById("modalTaskList");
    const closeModal = document.getElementById("closeModal");

    function openTaskModal(
        dateString,
        tasks
    ){
        const date = 
            new Date(
                dateString + "T00:00:00"
            );
        const formattedDate = 
            date.toLocaleDateString(
                "default",
                {
                    month: "long",
                    day: "numeric",
                    year: "numeric"
                }
            );
        modalDate.textContent =
            `Tasks for ${formattedDate}`;
        modalTaskList.innerHTML = "";

        if(tasks.length === 0){
            modalTaskList.innerHTML =
                "<p>No tasks scheduled.</p>";
        }

        tasks.forEach(
            function (task){
                const taskElement =
                    document.createElement("div");
                taskElement.classList.add(
                    "modal-task"
                );
                taskElement.innerHTML = `
                    <div class="modal-task-name">
                        • ${task.name}
                    </div>
                    <div class="modal-task-time">
                        ${task.startTime} - ${task.endTime}
                    </div>
                `;

                modalTaskList.appendChild(
                    taskElement
                );
            }
        );
        taskModal.style.display = "flex";
    }

closeModal.addEventListener(
    "click",
    function(){
        taskModal.style.display = "none";
    }
);

taskModal.addEventListener(
    "click",
    function(event){
        if(event.target === taskModal){
            taskModal.style.display = "none";
        }
    }
);

</script>
<script src="saveloadfeat.js"></script>

</body>

</html>
